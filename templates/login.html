<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Socratic AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
    <div class="auth-container glass">
        <div class="logo auth-logo">
            <h1>Socratic AI</h1>
            <div class="status-indicator"></div>
        </div>
        <h2>Sign In</h2>
        {% if error %}
            <div class="system-alert incorrect" style="margin-bottom: 1rem;">{{ error }}</div>
        {% endif %}
        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" class="auth-btn">Log In</button>
        </form>
        <p class="auth-links">Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.</p>
    </div>
</body>
</html>
